services:
  db:
    image: postgres:16-alpine
    container_name: kcc_db_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kcc_luiz}
      POSTGRES_USER: ${POSTGRES_USER:-kcc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_database_password}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLIC_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kcc_user} -d ${POSTGRES_DB:-kcc_luiz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  backend:
    build:
      context: ./backend
      target: development
    container_name: kcc_backend_dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kcc_user}:${POSTGRES_PASSWORD:-change_this_database_password}@db:5432/${POSTGRES_DB:-kcc_luiz}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_me_with_32_chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:15173,http://localhost:18081}
      COOKIE_SECURE: "false"
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PUBLIC_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: sync
          path: ./backend/tests
          target: /app/tests
        - action: sync
          path: ./backend/alembic
          target: /app/alembic
        - action: sync
          path: ./backend/alembic.ini
          target: /app/alembic.ini
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: kcc_frontend_dev
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_DEV_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PUBLIC_PORT:-15173}:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/Dockerfile
        - action: rebuild
          path: ./frontend/vite.config.ts
        - action: rebuild
          path: ./frontend/tailwind.config.js
        - action: rebuild
          path: ./frontend/postcss.config.js
    networks:
      - app_net

  proxy:
    image: nginx:1.27-alpine
    container_name: kcc_proxy_dev
    ports:
      - "${PROXY_PUBLIC_PORT:-18081}:80"
    volumes:
      - ./infra/nginx/app.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app_net

volumes:
  postgres_data_dev:
  frontend_node_modules:

networks:
  app_net:
    driver: bridge
