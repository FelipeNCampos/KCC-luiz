# Este arquivo entra no Nginx principal da VPS, fora deste docker compose.
# Exemplo: /etc/nginx/sites-available/novoapp.conf
# Depois: sudo ln -s /etc/nginx/sites-available/novoapp.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name novoapp.seudominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name novoapp.seudominio.com;

    ssl_certificate /etc/letsencrypt/live/novoapp.seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novoapp.seudominio.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
